
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
}

.course-box {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 18px;
    border: 1px solid #ddd;
    border-radius: 12px;
    background: #fff;
}

.course-box img {
    width: 180px;
    height: 140px;
    object-fit: cover;
    border-radius: 8px;
}

.course-content {
    flex: 1;
}

.course-content h3 {
    margin: 0 0 10px;
    color: #2e3a90;
}

.course-content p {
    margin: 5px 0;
    font-size: 14px;
}

.course-price {
    color: #d92332;
    font-weight: bold;
    font-size: 20px;
}

.course-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 18px;
    color: white;
    background: #2e3a90;
    border-radius: 5px;
    text-decoration: none;
}

@media(max-width: 600px) {
    .course-box {
        flex-direction: column;
        align-items: stretch;
    }

    .course-box img {
        width: 100%;
        height: auto;
    }
}
</style>
</head>
<body>

<div class="course-box">
    <img src="https://daylaixeoto.vn/wp-content/uploads/hoc-b-so-tu-dong.jpg" alt="Học bằng B số tự động">

    <div class="course-content">
        <h3>Khóa Học Bằng B Số Tự Động</h3>
        <p>Thời gian đào tạo: 2 – 2,5 tháng</p>
        <p>Học thực hành và thực hành cabin</p>
        <p class="course-price">20.405.000đ</p>
        <a class="course-btn" href="https://daylaixeoto.vn/">Đăng ký ngay</a>
    </div>
</div>

</body>
</html>
